<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessa Studio | Centro de Innovación Tecnológica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --background-primary: #000000;
        --background-secondary: #111111;
        --text-primary: #ffe8d6;
        --text-secondary: #b7b7a4;
        --accent-primary: #cb997e;
        --accent-secondary: #ddbea9;
        --border-primary: #2d2d2d;
        --border-secondary: #3d3d3d;
        --blur-backdrop-bg: rgba(17, 17, 17, 0.7);
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--background-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .blur-backdrop {
        background-color: var(--blur-backdrop-bg);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        transition: background-color 0.3s ease;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--background-secondary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-secondary);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }
    </style>
